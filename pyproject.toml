[project]
name = "agenticai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "reddymaestro12", email = "reddymaestro12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "langchain>=1.4.5",
    "langchain-anthropic>=1.7.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "uuid6>=2025.0.1",
]

[project.scripts]
agenticai = "agenticai:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
